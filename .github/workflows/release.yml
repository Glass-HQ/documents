# Publishes the public packages when `node scripts/release.ts <version>` has tagged
# documents@<version> and the tag is pushed. Running it from the Actions tab is a dry run:
# everything builds and checks, and nothing is published.
name: Release

on:
  push:
    tags: ["documents@*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: write # gh release create
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          package-manager: |
            bun: false
          node-version-file: package.json
          run-install: false

      # The package embeds the Rust core as WebAssembly. rustup reads the toolchain, its
      # components and the wasm32 target from rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      - name: Install wasm-pack
        run: |
          curl -sSfL -o "$RUNNER_TEMP/wasm-pack.tar.gz" \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz
          echo "410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2  $RUNNER_TEMP/wasm-pack.tar.gz" | sha256sum --check
          sudo tar xzf "$RUNNER_TEMP/wasm-pack.tar.gz" --strip-components=1 -C /usr/local/bin \
            wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack

      - run: bun install --frozen-lockfile

      - name: Check the tag matches the package versions
        if: github.event_name == 'push'
        run: node scripts/release.ts --verify "$GITHUB_REF_NAME"

      # The type-aware lint reads the types wasm-pack generates for the core.
      - run: node scripts/build-core-wasm.mjs
      - run: vp check
      - run: vp run build
      - run: vp run test
      - run: node scripts/format-table.mjs --check
      - run: node scripts/changelog.ts check
      - run: vp run cargo:fmt
      - run: vp run cargo:clippy
      - run: vp run cargo:test

      - name: Pack
        run: |
          node scripts/changelog.ts build
          node scripts/check-package.ts
          mkdir -p "$RUNNER_TEMP/packs"
          for dir in $(node --input-type=module -e 'import { publicPackages } from "./scripts/packages.ts"; for (const pkg of await publicPackages()) console.log(pkg.dir)'); do
            (cd "$dir" && bun pm pack --destination "$RUNNER_TEMP/packs")
          done
          ls -l "$RUNNER_TEMP/packs"

      # Trusted publishing needs npm 11.5.1 or later. npm verifies this workflow through OIDC, so
      # no token is stored, and adds provenance on its own for a public repository.
      - name: Publish
        env:
          DRY_RUN: ${{ github.event_name != 'push' }}
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install --global npm@11
          fi
          for pack in "$RUNNER_TEMP"/packs/*.tgz; do
            name="$(tar -xOzf "$pack" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
            version="$(tar -xOzf "$pack" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping."
            elif [ "$DRY_RUN" = true ]; then
              npm publish "$pack" --access public --dry-run
            else
              npm publish "$pack" --access public
            fi
          done

      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#documents@}"
          node scripts/changelog.ts notes "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Documents $version" \
            --notes-file "$RUNNER_TEMP/notes.md"
