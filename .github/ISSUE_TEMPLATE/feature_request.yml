name: Feature request
description: Suggest something new or better.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: The change you have in mind, and how you'd use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives (optional)
      description: Workarounds or other approaches you've considered.
  - type: textarea
    id: context
    attributes:
      label: Anything else (optional)
